<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SLAM 2026 CARSON Telemetry Viewer</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
	
	<link
		href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css"
		rel="stylesheet"
	>
	
	<link
		href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css"
		rel="stylesheet"
	>

</head>


<body>

    <header>

        <h1 id="dashboard-title">
            SLAM 2026 CARSON Telemetry Viewer
        </h1>

        <div id="deployment-info"></div>

    </header>


    <main>

        <!-- Parameter selector -->

        <section class="controls">

            <label for="parameter-select">
                Payload Data Plot Parameter
            </label>

            <select id="parameter-select"></select>

        </section>


        <!-- Map -->

        <section class="panel">

            <div class="panel-header">

                <h2>
                    Payload Data Map View
                </h2>

            </div>


            <div class="map-container">

                <div id="map"></div>


                <!-- Colorbar -->

				<div id="colorbar-container">

					<div id="colorbar-title"></div>

					<div class="colorbar-wrapper">

						<div class="colorbar-values">

							<div id="colorbar-max"></div>

							<div id="colorbar-min"></div>

						</div>

						<div id="colorbar"></div>

					</div>


					<!-- Interactive color range slider -->

					<div id="color-range-slider"></div>

				</div>

            </div>

        </section>


        <!-- Time series -->

        <section class="panel">

            <div class="panel-header">

                <h2 id="timeseries-title">
                    Payload Data Time Series
                </h2>

            </div>

            <div id="timeseries"></div>

        </section>

    </main>


    <!-- Leaflet -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- Plotly -->

    <script
        src="https://cdn.plot.ly/plotly-2.35.2.min.js">
    </script>

	<script src="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.js"></script>
	
    <!-- Dashboard -->

    <script src="dashboard.js"></script>


</body>

</html>
